<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration Center — Riwayat Mutasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213d; --slate:#3b5a82; --gray-mute:#6b7785;
    --bg:#f5f7fa; --card:#fff; --gold:#b08d57; --border:#e4e8ee;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--navy); min-height:100vh; }
  .topbar{ background:#fff; border-bottom:1px solid var(--border); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .topbar .eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .topbar h1{ font-family:'Source Serif 4', serif; font-size:18px; font-weight:600; }
  .back-link{ font-size:13px; color:var(--slate); text-decoration:none; font-weight:500; }
  .wrap{ max-width:1200px; margin:0 auto; padding:28px 24px; }
  .controls{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .search-box{ flex:1; min-width:220px; padding:10px 14px; border:1px solid var(--border); border-radius:6px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; background:#fff; }
  .count-note{ font-size:12.5px; color:var(--gray-mute); margin-bottom:12px; }
  .table-wrap{ background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:900px; }
  thead th{ text-align:left; padding:12px 14px; background:#f8f9fb; color:var(--gray-mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; border-bottom:1px solid var(--border); }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
  tbody tr:hover{ background:#fafbfc; }
  .name-cell{ font-weight:600; color:var(--navy); }
  .move-arrow{ color:var(--gold); margin:0 4px; }
  .btn-detail{ font-size:12px; font-weight:600; color:var(--slate); background:#eef2f7; border:none; padding:6px 10px; border-radius:5px; cursor:pointer; }
  .btn-detail:hover{ background:#e2e9f2; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--gray-mute); font-size:13.5px; }
  .denied{ text-align:center; padding:80px 20px; }
  .denied h2{ font-family:'Source Serif 4', serif; font-size:22px; margin-bottom:10px; }
  .denied p{ color:var(--gray-mute); font-size:14px; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(20,33,61,0.5); align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; border-radius:10px; padding:26px; max-width:380px; width:100%; text-align:center; }
  .modal h3{ font-family:'Source Serif 4', serif; font-size:18px; margin-bottom:14px; }
  .modal .amount{ font-size:24px; font-weight:600; color:var(--navy); margin-bottom:18px; }
  .modal-close{ width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); background:#fff; font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

  <div class="topbar">
    <div>
      <div class="eyebrow">SDM</div>
      <h1>Riwayat Mutasi</h1>
    </div>
    <a class="back-link" href="dashboard.html">← Kembali ke Dashboard</a>
  </div>

  <div id="loadingCheck" class="wrap"><p style="color:var(--gray-mute); font-size:14px;">Memeriksa akses...</p></div>
  <div id="denied" class="denied" style="display:none;">
    <h2>Akses Ditolak</h2>
    <p>Kamu belum punya akses ke menu SDM.</p>
  </div>

  <div id="gate" class="wrap" style="display:none;">
    <div class="controls">
      <input type="text" class="search-box" id="searchBox" placeholder="Cari nama karyawan...">
    </div>
    <div class="count-note" id="countNote"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Perpindahan Jabatan</th>
            <th>Perpindahan Wilayah</th>
            <th>Tanggal Efektif</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">Belum ada data mutasi.</div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Penyesuaian Gaji</h3>
      <div class="amount" id="modalAmount">—</div>
      <p style="font-size:12.5px; color:var(--gray-mute); margin-bottom:16px;">Hanya terlihat oleh administrator</p>
      <button class="modal-close" id="modalClose">Tutup</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRsO8ft9pHY0H3_5VXQD_-UftRYYVA-o",
      authDomain: "business-admin-center.firebaseapp.com",
      projectId: "business-admin-center",
      storageBucket: "business-admin-center.firebasestorage.app",
      messagingSenderId: "165059982705",
      appId: "1:165059982705:web:2afa897d5b06fe2a1572d0",
      measurementId: "G-TSW82QKX0P"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isAdmin = false;
    let allRows = [];

    auth.onAuthStateChanged(async function(user){
      const loadingEl = document.getElementById('loadingCheck');
      if(!user){ window.location.href = 'login.html'; return; }

      let userData = null;
      try{
        const doc = await db.collection('users').doc(user.uid).get();
        userData = doc.exists ? doc.data() : null;
      }catch(e){}

      if(!userData || userData.status === 'pending'){ window.location.href = 'pending.html'; return; }

      isAdmin = userData.role === 'administrator' || userData.role === 'admin';
      const hasSdm = isAdmin || (userData.permissions && userData.permissions.sdm);

      loadingEl.style.display = 'none';
      if(!hasSdm){
        document.getElementById('denied').style.display = 'block';
        return;
      }
      document.getElementById('gate').style.display = 'block';
      loadMutasi();
    });

    async function loadMutasi(){
      const emptyState = document.getElementById('emptyState');
      try{
        const snap = await db.collection('mutasi').get();
        if(snap.empty){ emptyState.style.display = 'block'; return; }
        allRows = [];
        snap.forEach(doc => allRows.push({ id: doc.id, ...doc.data() }));
        allRows.sort((a,b) => (a.nama||'').localeCompare(b.nama||''));
        renderTable(allRows);
      }catch(e){
        emptyState.style.display = 'block';
        emptyState.textContent = 'Gagal memuat data: ' + e.message;
      }
    }

    function renderTable(rows){
      const tbody = document.getElementById('tableBody');
      document.getElementById('countNote').textContent = `Menampilkan ${rows.length} dari ${allRows.length} riwayat mutasi.`;
      tbody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name-cell">${r.nama || '-'}</td>
          <td>${r.jabatanSebelum || '-'} <span class="move-arrow">→</span> ${r.jabatanSesudah || '-'}</td>
          <td>${r.wilayahSebelum || '-'} <span class="move-arrow">→</span> ${r.wilayahSesudah || '-'}</td>
          <td>${r.effectiveDate || '-'}</td>
          <td>${r.status || '-'}</td>
          <td>${isAdmin ? '<button class="btn-detail" data-id="'+r.id+'">Lihat Gaji</button>' : ''}</td>
        `;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.btn-detail').forEach(btn => {
        btn.addEventListener('click', () => openDetail(btn.dataset.id));
      });
    }

    document.getElementById('searchBox').addEventListener('input', function(){
      const q = this.value.toLowerCase().trim();
      renderTable(allRows.filter(r => !q || (r.nama||'').toLowerCase().includes(q)));
    });

    async function openDetail(docId){
      document.getElementById('modalAmount').textContent = 'Memuat...';
      document.getElementById('modalOverlay').classList.add('open');
      try{
        const doc = await db.collection('mutasi').doc(docId).collection('sensitive').doc('data').get();
        const d = doc.exists ? doc.data() : {};
        document.getElementById('modalAmount').textContent = d.penyesuaianGaji || '—';
      }catch(e){
        document.getElementById('modalAmount').textContent = 'Gagal memuat.';
      }
    }
    document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('open'));
    document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target === this) this.classList.remove('open'); });
  </script>
</body>
</html>
